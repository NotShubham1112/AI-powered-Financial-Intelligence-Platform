[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-agent-sdk"
description = "Python SDK for the Financial Agent Infrastructure Platform"
version = "0.1.0"
authors = [
    {name = "Financial Agent Platform Team", email = "dev@financialagent.example"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
"Homepage" = "https://github.com/financial-agent/platform"
"Documentation" = "https://docs.financialagent.example"
"Repository" = "https://github.com/financial-agent/platform.git"

[tool.setuptools.packages.find]
where = ["python"]
include = ["financialagent*"]

[tool.setuptools.package-data]
"financialagent" = ["py.typed"]