[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-mcp"
version = "1.0.0"
description = "Institutional Financial Computation MCP Server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "mcp>=1.0",
    "structlog>=24.1",
    "httpx>=0.26",
    "redis>=5.0",
    "celery>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.98",
    "ruff>=0.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "apps*",
    "core*",
    "engines*",
    "tools*",
    "schemas*",
    "registry*",
    "validation*",
    "market_data*",
    "workers*",
    "orchestration*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
