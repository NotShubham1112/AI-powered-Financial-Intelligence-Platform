name: Financial MCP CI

on:
  push:
    paths:
      - "financial-mcp/**"
      - ".github/workflows/financial-mcp-ci.yml"
  pull_request:
    paths:
      - "financial-mcp/**"

defaults:
  run:
    working-directory: financial-mcp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: financial-mcp/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check engines tools registry orchestration validation tests

      - name: Unit and property tests
        run: pytest tests -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build MCP image
        run: docker build -f infrastructure/docker/Dockerfile.mcp -t financial-mcp:test .

        working-directory: financial-mcp
